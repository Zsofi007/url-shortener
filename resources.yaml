---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-backend-service
spec:
  type: ClusterIP
  selector:
    app: url-shortener-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: url-shortener-frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-backend
  labels:
    app: url-shortener-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener-backend
  template:
    metadata:
      labels:
        app: url-shortener-backend
    spec:
      containers:
      - name: backend
        image: us-central1-docker.pkg.dev/$GOOGLE_PROJECT/url-shortener/backend:$IMAGE_TAG
        ports:
        - containerPort: 8000
        env:
        - name: DB_USER
          value: "$DB_USER"
        - name: PASSWORD
          value: "$PASSWORD"
        - name: HOST
          value: "$HOST"
        - name: PORT
          value: "$PORT"
        - name: DATABASE
          value: "$DATABASE"
        - name: DATABASE_URL
          value: "$DATABASE_URL"
        - name: DEBUG
          value: "$DEBUG"
        - name: BASE_URL
          value: "$BASE_URL"
        - name: BASE_URL_FRONTEND
          value: "$BASE_URL_FRONTEND"
        - name: SUPABASE_URL
          value: "$SUPABASE_URL"
        - name: SUPABASE_ANON_KEY
          value: "$SUPABASE_ANON_KEY"
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: "$SUPABASE_SERVICE_ROLE_KEY"
        - name: JWT_SECRET
          value: "$JWT_SECRET"
        - name: JWT_EXPIRY
          value: "$JWT_EXPIRY"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-frontend
  labels:
    app: url-shortener-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener-frontend
  template:
    metadata:
      labels:
        app: url-shortener-frontend
    spec:
      containers:
      - name: frontend
        image: us-central1-docker.pkg.dev/$GOOGLE_PROJECT/url-shortener/frontend:$IMAGE_TAG
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_BASE_URL
          value: "$VITE_API_BASE_URL"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
