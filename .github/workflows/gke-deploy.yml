# This workflow will build docker containers, publish them to GitHub Container Registry,
# and deploy them to GKE when there is a push to the "master" branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Google Kubernetes Engine (container.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Ensure that your repository contains the necessary configuration for your
#    Google Kubernetes Engine cluster, including deployment.yml,
#    kustomization.yml, service.yml, etc.
#
# 3. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Kubernetes Engine Developer (roles/container.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 4. Change the values in the "env" block to match your values.

name: 'Build and Deploy to GKE'

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  PROJECT_ID: 'url-shortener-470915' # Your Google Cloud project ID
  GKE_CLUSTER: 'autopilot-cluster-1' # TODO: update to your cluster name
  GKE_ZONE: 'us-central1' # TODO: update to your cluster zone
  BACKEND_DEPLOYMENT_NAME: 'url-shortener-backend' # TODO: update to your backend deployment name
  FRONTEND_DEPLOYMENT_NAME: 'url-shortener-frontend' # TODO: update to your frontend deployment name

jobs:
  setup-build-publish-deploy:
    name: 'Setup, Build, Publish, and Deploy'
    runs-on: 'ubuntu-latest'
    environment: 'production'

    permissions:
      contents: 'read'
      packages: 'write'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      # Authenticate to Google Cloud using service account key
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # Set up Docker Buildx
      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@v3'

      # Authenticate Docker to GitHub Container Registry
      - name: 'Log in to GitHub Container Registry'
        uses: 'docker/login-action@v3'
        with:
          registry: 'ghcr.io'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      # Get the GKE credentials so we can deploy to the cluster
      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116' # google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      # Build and push backend Docker image
      - name: 'Docker meta (backend)'
        id: 'meta_backend'
        uses: 'docker/metadata-action@v5'
        with:
          images: 'ghcr.io/${{ github.repository_owner }}/url-shortener-backend'
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: 'Build and push backend'
        uses: 'docker/build-push-action@v6'
        with:
          context: './backend'
          file: './backend/Dockerfile'
          push: true
          tags: '${{ steps.meta_backend.outputs.tags }}'
          labels: '${{ steps.meta_backend.outputs.labels }}'

      # Build and push frontend Docker image
      - name: 'Docker meta (frontend)'
        id: 'meta_frontend'
        uses: 'docker/metadata-action@v5'
        with:
          images: 'ghcr.io/${{ github.repository_owner }}/url-shortener-frontend'
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: 'Build and push frontend'
        uses: 'docker/build-push-action@v6'
        with:
          context: './url_frontend'
          file: './url_frontend/Dockerfile'
          push: true
          tags: '${{ steps.meta_frontend.outputs.tags }}'
          labels: '${{ steps.meta_frontend.outputs.labels }}'

      # Set up kustomize
      - name: 'Set up Kustomize'
        run: |-
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          chmod u+x ./kustomize

      # Deploy the Docker images to the GKE cluster
      - name: 'Deploy to GKE'
        run: |-
          # Get the latest image tags from GHCR
          BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/url-shortener-backend:${{ github.sha }}"
          FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/url-shortener-frontend:${{ github.sha }}"
          
          # Update kustomize with the new image tags
          ./kustomize edit set image backend=$BACKEND_IMAGE
          ./kustomize edit set image frontend=$FRONTEND_IMAGE
          
          # Deploy to GKE
          ./kustomize build . | kubectl apply -f -
          
          # Wait for deployments to be ready
          kubectl rollout status deployment/${{ env.BACKEND_DEPLOYMENT_NAME }}
          kubectl rollout status deployment/${{ env.FRONTEND_DEPLOYMENT_NAME }}
          
          # Show services
          kubectl get services -o wide
