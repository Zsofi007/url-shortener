name: Docker Compose CI

on: [push]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Compose
      - name: Set up Docker Compose
        run: |
          docker-compose up -d
      
      # Tear down the services
      - name: Tear down
        if: always()
        run: |
          docker-compose down