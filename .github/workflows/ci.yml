name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: url_frontend
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: url_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (deps + import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Compile (syntax check)
        run: python -m compileall -q app

      - name: Import app (startup-safe)
        env:
          PYTHONPATH: .
          # Minimal env to allow importing settings safely in CI.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: example
          SUPABASE_SECRET_KEY: example
        run: python -c "import app.main; print('Imported app.main OK')"

